name: cineflix

services:
  cineflix:
    build:
      context: .
      dockerfile: Dockerfile
    image: cineflix:3.3.0
    container_name: cineflix
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      OMDB_CACHE_FILE: /app/.cache/omdb-ratings.json
    ports:
      - "${CINEFLIX_PORT:-8787}:8787"
    volumes:
      - cineflix-cache:/app/.cache
    mem_limit: ${CINEFLIX_MEMORY_LIMIT:-384m}
    cpus: ${CINEFLIX_CPU_LIMIT:-1.0}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  cineflix-cache:
